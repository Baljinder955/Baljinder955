<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="900" viewBox="0 0 1720 900" role="img" aria-labelledby="title desc">
<title id="title">Baljinder Singh — developer toolkit</title>
<desc id="desc">Dark burgundy and rose portfolio toolkit showing Swift, SwiftUI, Dart, AI and machine learning learning, iOS and Flutter, VIPER, REST APIs, microservices, JWT authentication, MVVM, MVC, PostgreSQL, Hive, GetX, NoSQL, Git, GitHub, Postman, DBMS and OOP.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1015"/><stop offset="1" stop-color="#0b0d11"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#180910"/><stop offset=".5" stop-color="#351020"/><stop offset="1" stop-color="#11080d"/></linearGradient>
  <linearGradient id="roseLine"><stop stop-color="#c77b9b" stop-opacity=".25"/><stop offset=".48" stop-color="#f8eaf0"/><stop offset=".68" stop-color="#9d315b"/><stop offset="1" stop-color="#c77b9b" stop-opacity=".2"/></linearGradient>
  <radialGradient id="roseGlow"><stop stop-color="#b33e70" stop-opacity=".44"/><stop offset="1" stop-color="#6e1839" stop-opacity="0"/></radialGradient>
  <radialGradient id="spark"><stop stop-color="#fff8fb"/><stop offset=".35" stop-color="#f3c6d8" stop-opacity=".92"/><stop offset="1" stop-color="#d35c8a" stop-opacity="0"/></radialGradient>
  <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#210b14"/><stop offset="1" stop-color="#160910"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .eyebrow{font-size:16px;letter-spacing:3px;font-weight:600;fill:#c77b9b}
    .headline{font-size:57px;fill:#f8f0f3;letter-spacing:-1.2px}
    .cardTitle{font-size:17px;letter-spacing:2.2px;fill:#d38aa8;font-weight:600}
    .large{font-size:42px;fill:#f8f0f3;letter-spacing:-1px}
    .medium{font-size:34px;fill:#f8f0f3;letter-spacing:-.7px}
    .small{font-size:22px;fill:#bba8b1}
    .micro{font-size:16px;letter-spacing:1.8px;fill:#d9b9c7}
    .card{fill:url(#cardFill);stroke:#9b4567;stroke-opacity:.36;stroke-width:1.5}
    .entry{opacity:0;animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards}
    .a1{animation-delay:.04s}.a2{animation-delay:.14s}.a3{animation-delay:.24s}.a4{animation-delay:.34s}.a5{animation-delay:.44s}.a6{animation-delay:.54s}
    .trace{fill:none;stroke:url(#roseLine);stroke-width:2.1;stroke-dasharray:120 720;stroke-linecap:round;animation:trace 7.5s linear infinite}
    .orbit{fill:none;stroke:#d36b96;stroke-opacity:.52;stroke-width:1.5}
    .sparkle{animation:pulse 2.5s ease-in-out infinite}
    @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes trace{to{stroke-dashoffset:-840}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.entry{opacity:1;animation:none}.trace,.sparkle{animation:none}}
  </style>
</defs>
<rect width="1720" height="900" fill="url(#bg)"/>
<!-- Header -->
<text class="mono eyebrow" x="120" y="49">04 TOOLKIT</text>
<text class="serif headline" x="116" y="116">The tools I <tspan fill="#e6b3c8" font-style="italic">reach for.</tspan></text>
<text class="mono" x="1135" y="49" font-size="15" letter-spacing="2.7" fill="#bca8b1">IOS · FLUTTER · BACKEND · ARCHITECTURE</text>
<path d="M119 147 H1600" stroke="url(#roseLine)" stroke-width="1.5"/>
<circle class="sparkle" cx="850" cy="147" r="13" fill="url(#spark)"/>
<!-- Outer frame -->
<rect x="44" y="188" width="1638" height="674" rx="27" fill="url(#panel)" stroke="#8f3b5c" stroke-opacity=".38" stroke-width="1.5"/>
<ellipse cx="865" cy="522" rx="690" ry="350" fill="url(#roseGlow)"/>
<!-- Grid separators -->
<path d="M615 218 V846 M1140 218 V846 M71 540 H1657" stroke="#a64c70" stroke-opacity=".36" stroke-width="1.3"/>
<circle class="sparkle" cx="1103" cy="540" r="13" fill="url(#spark)"/>
<g fill="#10070c" stroke="#e5b5c7" stroke-width="1.5"><rect x="607" y="532" width="16" height="16" transform="rotate(45 615 540)"/><rect x="1132" y="532" width="16" height="16" transform="rotate(45 1140 540)"/></g>

<!-- 01 Languages -->
<g class="entry a1" transform="translate(72 223)">

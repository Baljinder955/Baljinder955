  <path d="M20 1 H132" fill="none" stroke="#f8edf2" stroke-width="2.2" stroke-linecap="round"/>
  <text class="mono cardTitle" x="34" y="46">02 AI · ML</text>
  <text class="serif large" x="34" y="111">Learning</text>
  <text class="serif medium" x="34" y="158">AI &amp; Machine Learning</text>
  <text class="mono micro" x="34" y="251">EXPLORING · BUILDING · LEARNING</text>

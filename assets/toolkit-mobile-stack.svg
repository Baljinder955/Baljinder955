  <text class="serif large" x="34" y="111">Swift · SwiftUI</text>
  <text class="serif large" x="34" y="158">Dart</text>
  <!-- code tile -->
  <g transform="translate(367 68)" stroke="#d88aa9" stroke-width="1.5">
    <path d="M0 26 L58 0 L112 26 L55 55 Z" fill="#57172e" fill-opacity=".55" stroke-opacity=".35"/>
    <path d="M0 26 V113 L55 143 V55 Z" fill="#381020" fill-opacity=".8"/>
    <path d="M55 55 L112 26 V112 L55 143 Z" fill="#57172e" fill-opacity=".65"/>
    <path d="M29 65 L14 78 L29 91 M65 65 L80 78 L65 91 M55 61 L43 96" fill="none" stroke="#f3c6d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="26" r="4" fill="#e5b5c7"/>
  </g>
  <text class="mono micro" x="34" y="251">SWIFT · SWIFTUI · DART</text>
</g>

<!-- 02 AI / ML -->
<g class="entry a2" transform="translate(633 223)">

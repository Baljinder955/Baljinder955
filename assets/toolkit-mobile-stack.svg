  <path d="M1 72 V23 Q1 1 23 1 H102" fill="none" stroke="#f8edf2" stroke-width="2.2" stroke-linecap="round"/>
  <text class="mono cardTitle" x="32" y="46">03 MOBILE DEVELOPER</text>
  <text class="serif large" x="32" y="111">iOS &amp; Flutter</text>
  <text class="mono micro" x="32" y="251">IOS · SWIFTUI · FLUTTER · DART</text>
  <g transform="translate(326 38)">
    <ellipse cx="83" cy="124" rx="102" ry="22" fill="none" stroke="#9d315b" stroke-width="2" stroke-opacity=".7"/>
    <g transform="rotate(-9 45 91)"><rect x="5" y="5" width="73" height="154" rx="15" fill="#05080c" stroke="#d5c6ce" stroke-width="2"/><rect x="11" y="13" width="61" height="137" rx="10" fill="#111923"/><rect x="28" y="9" width="28" height="4" rx="2" fill="#77717b"/><path d="M42 67 C29 50 15 64 26 78 L42 95 L58 78 C69 64 55 50 42 67Z" fill="#f5f0f3"/></g>
    <g transform="rotate(7 105 92)"><rect x="70" y="12" width="73" height="154" rx="15" fill="#05080c" stroke="#d5c6ce" stroke-width="2"/><rect x="76" y="20" width="61" height="137" rx="10" fill="#111923"/><rect x="93" y="16" width="28" height="4" rx="2" fill="#77717b"/><path d="M91 76 L115 53 L138 53 L114 77 L138 101 L115 101 Z" fill="#42c5f5"/></g>
  </g>
</g>


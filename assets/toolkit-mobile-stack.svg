  <g transform="translate(330 64)">
    <ellipse class="orbit" cx="65" cy="68" rx="99" ry="43" transform="rotate(-23 65 68)"/>
    <ellipse class="orbit" cx="65" cy="68" rx="92" ry="35" transform="rotate(43 65 68)"/>
    <path d="M33 56 Q30 32 49 29 Q59 12 75 29 Q99 25 102 47 Q119 57 104 76 Q102 96 83 97 Q68 111 53 96 Q32 99 30 79 Q17 69 33 56Z" fill="#b64e78" stroke="#e6a0ba" stroke-width="2"/>
    <path d="M65 30 V96 M49 35 Q38 48 53 58 Q38 69 48 84 M79 35 Q93 49 77 58 Q94 71 82 87 M34 57 Q49 53 54 64 M101 55 Q86 53 77 64" fill="none" stroke="#f5c4d7" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="-20" cy="38" r="6" fill="#d36b96"/><circle cx="151" cy="23" r="6" fill="#e5b5c7"/><circle cx="122" cy="127" r="6" fill="#d36b96"/>
  </g>
</g>

<!-- 03 Mobile -->

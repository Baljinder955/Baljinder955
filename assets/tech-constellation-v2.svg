<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 680" width="1720" height="680" role="img" aria-labelledby="title desc">
<title id="title">Baljinder Singh — mobile development toolkit</title>
<desc id="desc">Animated burgundy toolkit panel showing Swift, SwiftUI, Dart, learning AI and machine learning, iOS and Flutter development, VIPER, REST APIs, microservices, JWT authentication, MVVM, MVC, PostgreSQL, Hive, GetX, NoSQL, Git, GitHub, Postman, DBMS and OOP.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1015"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D0A12"/><stop offset=".55" stop-color="#351020"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B" stop-opacity=".25"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#C77B9B" stop-opacity=".15"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#9D315B" stop-opacity=".55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  <radialGradient id="pulse"><stop stop-color="#FFF7FB"/><stop offset=".35" stop-color="#E5B5C7" stop-opacity=".9"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .eyebrow{font-size:15px;letter-spacing:3px;fill:#C77B9B;font-weight:600}
    .heading{font-size:31px;fill:#F8F0F3;font-weight:500}
    .body{font-size:22px;fill:#E9DCE2}.muted{font-size:17px;fill:#B6A3AC}
    .card{fill:#190B12;fill-opacity:.86;stroke:#C77B9B;stroke-opacity:.27;stroke-width:1.4}
    .entry{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}
    .e1{animation-delay:.05s}.e2{animation-delay:.18s}.e3{animation-delay:.31s}.e4{animation-delay:.44s}.e5{animation-delay:.57s}.e6{animation-delay:.70s}
    .trace{fill:none;stroke:url(#line);stroke-width:2;stroke-dasharray:110 650;stroke-linecap:round;animation:trace 8s linear infinite}
    @keyframes rise{to{opacity:1}}
    @keyframes trace{to{stroke-dashoffset:-760}}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
    .pulse{animation:glow 2.4s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.entry{opacity:1;animation:none}.trace,.pulse{animation:none}}
  </style>
</defs>
<rect width="1720" height="680" fill="url(#bg)"/>
<text class="mono eyebrow" x="62" y="43">04 TOOLKIT</text>
<text class="serif" x="60" y="99" font-size="49" fill="#F8F0F3">The tools I <tspan font-style="italic" fill="#E5B5C7">reach for.</tspan></text>
<text class="mono" x="1120" y="43" font-size="14" letter-spacing="2.5" fill="#B6A3AC">IOS · FLUTTER · BACKEND · ARCHITECTURE</text>
<path d="M62 126 H1655" stroke="url(#line)" stroke-width="1.5"/>
<circle class="pulse" cx="850" cy="126" r="11" fill="url(#pulse)"/>
<rect x="16" y="150" width="1688" height="514" rx="27" fill="url(#panel)" stroke="#C77B9B" stroke-opacity=".24" stroke-width="1.5"/>
<ellipse cx="860" cy="410" rx="560" ry="270" fill="url(#glow)"/>
<path d="M574 174 V640 M1145 174 V640 M44 414 H1675" stroke="#C77B9B" stroke-opacity=".2" stroke-width="1.4"/>
<circle class="pulse" cx="1080" cy="414" r="12" fill="url(#pulse)"/>
<g fill="#10070C" stroke="#E5B5C7" stroke-width="1.5"><rect x="567" y="407" width="14" height="14" transform="rotate(45 574 414)"/><rect x="1138" y="407" width="14" height="14" transform="rotate(45 1145 414)"/></g>


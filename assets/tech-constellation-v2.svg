  <text class="serif heading" x="28" y="145">Dart</text>
  <text class="mono muted" x="28" y="185" letter-spacing="1.5">SWIFT · SWIFTUI · DART</text>
  <g transform="translate(390 76)" stroke="#E5B5C7" stroke-width="2" fill="#451126"><path d="M0 22 L45 0 L85 18 L42 43 Z" fill-opacity=".6"/><path d="M0 22 V78 L42 101 V43 Z" fill-opacity=".35"/><path d="M42 43 L85 18 V74 L42 101 Z" fill-opacity=".75"/><path d="M20 48 L37 37 L30 58 L48 50" fill="none" stroke="#F8F0F3" stroke-width="3"/></g>
</g>

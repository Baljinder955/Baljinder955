  <g transform="translate(390 67)" stroke="#E5B5C7" stroke-width="1.5"><path d="M10 0 Q0 -5 -4 6 Q-16 5 -15 18 Q-15 28 0 28 H38 Q52 28 50 15 Q49 6 38 7 Q32 -8 18 0 Z" fill="#9D315B" fill-opacity=".65"/><rect x="-3" y="43" width="47" height="15" rx="4" fill="#451126"/><rect x="2" y="64" width="37" height="15" rx="4" fill="#451126"/><rect x="7" y="85" width="27" height="15" rx="4" fill="#451126"/><path d="M25 39 V45 M25 58 V65 M25 79 V86" fill="none"/><path d="M52 60 L65 67 L61 87 L49 95 L37 87 L34 67 Z" fill="#190B12"/><path d="M45 75 L50 80 L57 71" fill="none" stroke-width="2.5"/></g>
</g>

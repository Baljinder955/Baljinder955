  <text class="mono eyebrow" x="28" y="43">02 AI · ML</text>
  <text class="serif heading" x="28" y="101">Learning</text>
  <text class="serif muted" x="28" y="145">Exploring AI &amp; ML</text>
  <text class="mono muted" x="28" y="185" letter-spacing="1.2">CURIOUS · BUILDING · LEARNING</text>
  <g transform="translate(390 55)" fill="none" stroke="#C77B9B" stroke-width="1.8"><ellipse cx="54" cy="56" rx="78" ry="30" transform="rotate(-25 54 56)"/><ellipse cx="54" cy="56" rx="78" ry="30" transform="rotate(45 54 56)"/><circle cx="54" cy="56" r="29" fill="#9D315B" fill-opacity=".6"/><path d="M38 49 Q44 31 54 46 Q66 29 72 49 L68 68 L57 76 L43 67 Z" fill="#E5B5C7" fill-opacity=".55"/><circle cx="-16" cy="32" r="5" fill="#E5B5C7"/><circle cx="119" cy="25" r="5" fill="#E5B5C7"/><circle cx="91" cy="110" r="5" fill="#E5B5C7"/></g>
</g>

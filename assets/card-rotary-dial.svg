<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">rotary_dial</title><desc id="d">OPEN SOURCE  /  FLUTTER PACKAGE. A smooth, customizable rotary dial widget for Flutter Works on iOS and Android Written in Dart Public repository on GitHub</desc>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset=".5" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity=".05"/></pattern>
<style>
    .serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:in 1s cubic-bezier(.16,1,.3,1) forwards}
    .fade{opacity:0;animation:fade 1s ease forwards}
    .trace{fill:none;stroke:#E5B5C7;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:90 900;animation:trace 8s linear infinite}
    .chip{animation:glow 5s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes trace{to{stroke-dashoffset:-990}}
    @keyframes glow{0%,100%{stroke-opacity:.28}50%{stroke-opacity:.95}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:1}}
    @media (prefers-reduced-motion:reduce){.in,.fade{opacity:1;animation:none}.trace,.chip,.pulse{animation:none}}
</style></defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/><rect width="1200" height="300" rx="20" fill="url(#glow)"/><rect width="1200" height="300" rx="20" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>
<g class="in"><rect x="40" y="40" width="190" height="190" rx="34" fill="#10070C" stroke="#C77B9B" stroke-opacity=".35"/><circle class="pulse" cx="135" cy="135" r="118" fill="none" stroke="#C77B9B" stroke-opacity=".3" stroke-dasharray="3 8"/><clipPath id="lg"><rect x="55" y="55" width="160" height="160" rx="26"/></clipPath><image href="data:image/svg+xml;base64," x="55" y="55" width="160" height="160" clip-path="url(#lg)" preserveAspectRatio="xMidYMid slice"/></g>
<g class="in" style="animation-delay:.2s"><text class="mono" x="270" y="52" font-size="11" letter-spacing="3" fill="#C77B9B">OPEN SOURCE  /  FLUTTER PACKAGE</text><text class="serif" x="270" y="92" font-size="38" font-weight="300" fill="#F8F0F3">rotary_dial</text><rect x="270" y="104" width="560" height="2" rx="1" fill="url(#acc)"><animate attributeName="width" values="0;560" dur="1.4s" begin=".5s" fill="freeze"/></rect></g>
<g class="in" style="animation-delay:0.60s"><circle cx="278" cy="134" r="3.5" fill="#C77B9B"/><text class="sans" x="294" y="139" font-size="14" fill="#E9DDE3">A smooth, customizable rotary dial widget for Flutter</text></g>
<g class="in" style="animation-delay:0.85s"><circle cx="278" cy="162" r="3.5" fill="#C77B9B"/><text class="sans" x="294" y="167" font-size="14" fill="#E9DDE3">Works on iOS and Android</text></g>
<g class="in" style="animation-delay:1.10s"><circle cx="278" cy="190" r="3.5" fill="#C77B9B"/><text class="sans" x="294" y="195" font-size="14" fill="#E9DDE3">Written in Dart</text></g>
<g class="in" style="animation-delay:1.35s"><circle cx="278" cy="218" r="3.5" fill="#C77B9B"/><text class="sans" x="294" y="223" font-size="14" fill="#E9DDE3">Public repository on GitHub</text></g>
<g class="in" style="animation-delay:1.40s"><rect class="chip" style="animation-delay:0.00s" x="270" y="252" width="69" height="24" rx="12" fill="#10070C" fill-opacity=".7" stroke="#C77B9B" stroke-opacity=".5"/><text class="mono" x="304" y="268.0" text-anchor="middle" font-size="11" fill="#F8F0F3">Flutter</text></g><g class="in" style="animation-delay:1.47s"><rect class="chip" style="animation-delay:0.45s" x="347" y="252" width="48" height="24" rx="12" fill="#10070C" fill-opacity=".7" stroke="#C77B9B" stroke-opacity=".5"/><text class="mono" x="371" y="268.0" text-anchor="middle" font-size="11" fill="#F8F0F3">Dart</text></g><g class="in" style="animation-delay:1.54s"><rect class="chip" style="animation-delay:0.90s" x="403" y="252" width="97" height="24" rx="12" fill="#10070C" fill-opacity=".7" stroke="#C77B9B" stroke-opacity=".5"/><text class="mono" x="452" y="268.0" text-anchor="middle" font-size="11" fill="#F8F0F3">Open Source</text></g><g class="in" style="animation-delay:1.61s"><rect class="chip" style="animation-delay:1.35s" x="508" y="252" width="41" height="24" rx="12" fill="#10070C" fill-opacity=".7" stroke="#C77B9B" stroke-opacity=".5"/><text class="mono" x="528" y="268.0" text-anchor="middle" font-size="11" fill="#F8F0F3">iOS</text></g><g class="in" style="animation-delay:1.68s"><rect class="chip" style="animation-delay:1.80s" x="557" y="252" width="69" height="24" rx="12" fill="#10070C" fill-opacity=".7" stroke="#C77B9B" stroke-opacity=".5"/><text class="mono" x="592" y="268.0" text-anchor="middle" font-size="11" fill="#F8F0F3">Android</text></g>
<g class="in" style="animation-delay:.9s"><text class="mono" x="1160" y="52" text-anchor="end" font-size="11" letter-spacing="2" fill="#B6A3AC">GITHUB</text></g>
</svg>

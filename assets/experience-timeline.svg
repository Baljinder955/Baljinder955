<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
<title id="t">Education and experience timeline</title><desc id="d">BCA at Guru Nanak Dev University 2015-2018, Executive at Kishan Maraine Services 2018-2022, iOS and Flutter Developer at Netset Software Solutions since March 2023.</desc>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset=".5" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity=".05"/></pattern>
<style>
    .serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:in 1s cubic-bezier(.16,1,.3,1) forwards}
    .fade{opacity:0;animation:fade 1s ease forwards}
    .trace{fill:none;stroke:#E5B5C7;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:90 900;animation:trace 8s linear infinite}
    .chip{animation:glow 5s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes trace{to{stroke-dashoffset:-990}}
    @keyframes glow{0%,100%{stroke-opacity:.28}50%{stroke-opacity:.95}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:1}}
    @media (prefers-reduced-motion:reduce){.in,.fade{opacity:1;animation:none}.trace,.chip,.pulse{animation:none}}
</style></defs>
<rect width="1200" height="260" rx="20" fill="url(#bg)"/><rect width="1200" height="260" rx="20" fill="url(#glow)"/><rect width="1200" height="260" rx="20" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="259" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>
<path d="M170 110H1030" stroke="#C77B9B" stroke-opacity=".25" stroke-width="2"/>
<path d="M170 110H1030" stroke="url(#acc)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.4s" begin="0.4s" fill="freeze"/></path>
<circle r="6" cy="110" fill="#F8F0F3"><animate attributeName="cx" values="170;1030" dur="5s" begin="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" begin="2.8s" repeatCount="indefinite"/></circle>
<g class="in" style="animation-delay:0.5s"><circle class="pulse" cx="170" cy="110" r="12" fill="#C77B9B" fill-opacity=".25" style="animation-delay:0.0s"/><circle cx="170" cy="110" r="7" fill="#701A3D" stroke="#E5B5C7" stroke-width="2"/><text class="mono" x="170" y="70" text-anchor="middle" font-size="11" letter-spacing="2" fill="#C77B9B">MAR 2023</text><text class="serif" x="170" y="165" text-anchor="middle" font-size="24" fill="#F8F0F3">iOS Jr. Developer</text><text class="sans" x="170" y="192" text-anchor="middle" font-size="14" fill="#E5B5C7">Netset Software Solutions, Mohali</text><text class="sans" x="170" y="218" text-anchor="middle" font-size="12" fill="#B6A3AC">Joined the team building native iOS apps</text></g>
<g class="in" style="animation-delay:1.3s"><circle class="pulse" cx="600" cy="110" r="12" fill="#C77B9B" fill-opacity=".25" style="animation-delay:0.7s"/><circle cx="600" cy="110" r="7" fill="#701A3D" stroke="#E5B5C7" stroke-width="2"/><text class="mono" x="600" y="70" text-anchor="middle" font-size="11" letter-spacing="2" fill="#C77B9B">PROMOTED</text><text class="serif" x="600" y="165" text-anchor="middle" font-size="24" fill="#F8F0F3">iOS Sr. Developer</text><text class="sans" x="600" y="192" text-anchor="middle" font-size="14" fill="#E5B5C7">Netset Software Solutions</text><text class="sans" x="600" y="218" text-anchor="middle" font-size="12" fill="#B6A3AC">Ownership of features, releases &amp; production fixes</text></g>
<g class="in" style="animation-delay:2.1s"><circle class="pulse" cx="1030" cy="110" r="16" fill="#C77B9B" fill-opacity=".25" style="animation-delay:1.4s"/><circle cx="1030" cy="110" r="7" fill="#E5B5C7" stroke="#E5B5C7" stroke-width="2"/><text class="mono" x="1030" y="70" text-anchor="middle" font-size="11" letter-spacing="2" fill="#C77B9B">TODAY</text><text class="serif" x="1030" y="165" text-anchor="middle" font-size="24" fill="#F8F0F3">Hybrid Developer</text><text class="sans" x="1030" y="192" text-anchor="middle" font-size="14" fill="#E5B5C7">iOS &amp; Flutter</text><text class="sans" x="1030" y="218" text-anchor="middle" font-size="12" fill="#B6A3AC">Native iOS + cross-platform Flutter</text></g>
</svg>

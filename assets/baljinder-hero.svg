<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Baljinder Singh — iOS &amp; Flutter Application Developer</title>
  <desc id="desc">A cinematic burgundy developer identity banner with a fine technical grid, orbital geometry, animated wine gradients, and a glowing underline.</desc>
  <defs>
    <linearGradient id="bsHeroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="48%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
      <animate attributeName="x1" values="0;0.18;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bsWineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1"/>
      <stop offset="52%" stop-color="#C77B9B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.08"/>
      <animate attributeName="x1" values="-0.5;0.5;-0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1.5;0.5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bsText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="58%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
    <radialGradient id="bsOrb">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bsGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#E5B5C7" stroke-opacity="0.09" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.1" fill="#E5B5C7" fill-opacity="0.18"/>
    </pattern>
    <filter id="bsGlow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="bsFade">
      <linearGradient id="bsMaskGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
        <stop offset="45%" stop-color="white"/>
        <stop offset="100%" stop-color="white" stop-opacity="0.45"/>
      </linearGradient>
      <rect width="1200" height="440" fill="url(#bsMaskGrad)"/>
    </mask>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#bsHeroBg)"/>
  <rect width="1200" height="440" rx="22" fill="url(#bsGrid)" mask="url(#bsFade)"/>
  <ellipse cx="1010" cy="220" rx="290" ry="260" fill="url(#bsOrb)"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.38">
    <ellipse cx="1010" cy="218" rx="164" ry="82" transform="rotate(-31 1010 218)"/>
    <ellipse cx="1010" cy="218" rx="164" ry="82" transform="rotate(31 1010 218)"/>
    <circle cx="1010" cy="218" r="118" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0 1010 218" to="360 1010 218" dur="48s" repeatCount="indefinite"/>
    </circle>
    <path d="M820 218H1168M1010 42V394" stroke-opacity="0.16"/>
  </g>
  <circle cx="1117" cy="142" r="4" fill="#E5B5C7">
    <animate attributeName="opacity" values=".35;1;.35" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="898" cy="293" r="3" fill="#C77B9B">
    <animate attributeName="opacity" values="1;.25;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M70 74h38M70 74v38M1130 366h-38M1130 366v-38" fill="none" stroke="#C77B9B" stroke-width="1.4" stroke-opacity=".7"/>
  <text x="86" y="116" fill="#C77B9B" font-family="monospace" font-size="13" letter-spacing="4">MOBILE ENGINEERING / CREATIVE TECHNOLOGY</text>
  <text x="80" y="198" fill="url(#bsText)" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">Baljinder Singh</text>
  <text x="84" y="242" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing=".3">iOS &amp; Flutter Application Developer</text>
  <text x="84" y="275" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.2">CREATIVE TECHNOLOGIST</text>
  <path d="M84 310H595" stroke="#451126" stroke-width="3" stroke-linecap="round"/>
  <path d="M84 310H595" stroke="url(#bsWineGlow)" stroke-width="3" stroke-linecap="round" filter="url(#bsGlow)">
    <animate attributeName="stroke-dasharray" values="0 511;511 0;0 511" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="84" y="351" fill="#C77B9B" font-family="monospace" font-size="13" letter-spacing="2">SWIFT  /  SWIFTUI  /  FLUTTER  /  DART</text>
  <text x="84" y="385" fill="#F8F0F3" fill-opacity=".58" font-family="monospace" font-size="11" letter-spacing="2">BUILDING THOUGHTFUL MOBILE EXPERIENCES</text>
  <g transform="translate(1030 218)">
    <circle r="58" fill="#10070C" fill-opacity=".55" stroke="#C77B9B" stroke-opacity=".65"/>
    <circle r="47" fill="none" stroke="#E5B5C7" stroke-opacity=".24" stroke-dasharray="2 5"/>
    <path d="M-22 -10L0 -28L22 -10L22 13L0 29L-22 13Z" fill="none" stroke="#E5B5C7" stroke-width="1.5"/>
    <path d="M-12 2L-2 12L15 -9" fill="none" stroke="#C77B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M70 415H1130" stroke="#C77B9B" stroke-opacity=".25"/>
</svg>
